<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Shared editor</title>
    <link rel="stylesheet" href="/shared-editor.css" />
  </head>
  <body>
    <header>
      <input id="title" aria-label="Item title" maxlength="200" /><span id="saved" role="status"
        >Opening…</span
      >
      <button id="ask-toggle" type="button" aria-expanded="false" aria-controls="assistant">Assistant</button>
      <button id="undo" title="Undo your last edit (Ctrl+Z)">Undo</button
      ><button id="redo">Redo</button>
      <details id="menu" class="popover">
        <summary aria-label="Editor menu" title="Editor menu">☰</summary>
        <div class="menu-body">
          <label
            >Download as
            <select id="export" aria-label="Download format"></select
          ></label>
          <button id="download">Download</button>
          <button id="recovery">Recovery copy</button>
          <button id="retry">Retry save</button>
          <label><input id="show-agent" type="checkbox" checked /> Highlight assistant edits</label>
          <details id="history">
            <summary>Contributions</summary>
            <div id="contributions"></div>
          </details>
        </div>
      </details>
    </header>
    <div id="tools" role="toolbar" aria-label="Drawing tools"></div>
    <div id="formatting" role="toolbar" aria-label="Document formatting" hidden></div>
    <main id="board" hidden>
      <svg id="canvas" tabindex="0" aria-label="Shared whiteboard">
        <g id="scene"></g>
        <g id="selection"></g>
        <g id="presence"></g>
      </svg>
    </main>
    <main id="document" hidden aria-label="Shared document"></main>
    <footer>
      <button id="comment-selection" type="button" disabled>Comment on selection</button>
      <span id="hint">Select text to add an anchored comment.</span>
    </footer>
    <aside id="assistant" aria-label="Assistant conversation" hidden>
      <div class="assistant-head"><strong>Assistant</strong><button id="assistant-close" type="button" aria-label="Close assistant">×</button></div>
      <div id="conversation-state" role="status">Ready</div>
      <div id="assistant-scroll">
        <details id="comments-section" open hidden><summary id="comments-count">Comments</summary><div id="comments"></div></details>
        <div id="conversation" role="log" aria-label="Conversation about this item"></div>
        <div id="queued-questions"></div>
      </div>
      <div class="assistant-compose">
        <button id="whole-question" type="button">Ask about whole item</button>
        <details id="attached-context" open>
          <summary id="context-title">Choose content to discuss</summary>
          <blockquote id="context-quote"></blockquote>
          <details><summary>Full attached context</summary><pre id="context-detail"></pre></details>
          <button id="refresh-context" type="button">Refresh context</button>
        </details>
        <form id="ask">
          <label id="compose-label" for="question">Ask the assistant</label>
          <textarea id="question" aria-label="Question for the assistant" placeholder="Ask a question or give an instruction…" maxlength="10000" rows="3" required></textarea>
          <button id="question-send" type="submit">Send to assistant</button>
        </form>
        <div id="assistant-notice" role="status"></div>
      </div>
    </aside>
    <textarea id="shape-text" aria-label="Shape text" maxlength="10000" hidden></textarea>
    <dialog id="link-dialog">
      <form method="dialog">
        <label>Link URL<input id="link-url" type="url" placeholder="https://…" /></label
        ><button value="cancel">Cancel</button><button value="save">Save</button>
      </form>
    </dialog>
    <script src="/renderer.js" defer></script>
    <script src="/shared-editor.js" defer></script>
  </body>
</html>
