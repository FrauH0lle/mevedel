<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- SLOT: TITLE - e.g. "Product catalog" --></title>
<style>
  /* Shared artifact palette: warm neutrals with a blue accent. The styling is
     a clean default, not a house style - restyle freely, but change a token
     in every scope that declares it (the light :root, both dark blocks, and
     print) or the value snaps back. */
  :root {
    color-scheme: light dark;
    --bg:          #f9f9f7;
    --card:        #fcfcfb;
    --ink:         #0b0b0b;
    --ink-soft:    #52514e;
    --rule:        rgba(11, 11, 11, 0.1);
    --rule-strong: rgba(11, 11, 11, 0.2);
    --stripe:      rgba(11, 11, 11, 0.03);
    --hover:       rgba(11, 11, 11, 0.06);
    --accent:      #184f95;
    --accent-soft: color-mix(in srgb, var(--accent) 18%, transparent);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  /* Dark on both axes: the OS preference, unless the viewer pinned light, and
     the viewer's own data-theme stamp. :where() keeps the media block at :root
     specificity so an explicit stamp wins in either direction. */
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg:          #141412;
      --card:        #1d1d1b;
      --ink:         #ededea;
      --ink-soft:    #b3b1a9;
      --rule:        rgba(255, 255, 255, 0.12);
      --rule-strong: rgba(255, 255, 255, 0.22);
      --stripe:      rgba(255, 255, 255, 0.03);
      --hover:       rgba(255, 255, 255, 0.07);
      --accent:      #6da7ec;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:          #141412;
    --card:        #1d1d1b;
    --ink:         #ededea;
    --ink-soft:    #b3b1a9;
    --rule:        rgba(255, 255, 255, 0.12);
    --rule-strong: rgba(255, 255, 255, 0.22);
    --stripe:      rgba(255, 255, 255, 0.03);
    --hover:       rgba(255, 255, 255, 0.07);
    --accent:      #6da7ec;
  }
  :root[data-theme="light"] { color-scheme: light; }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
  }

  .wrap { max-width: 80rem; margin: 0 auto; padding: 2rem 1.5rem 3.5rem; }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.25rem 1rem;
    margin-bottom: 1rem;
  }
  h1 { font-size: 1.4rem; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  .scope { margin: 0; color: var(--ink-soft); font-size: 0.9rem; }

  .dt-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
  }

  /* Explicit background and color: the UA's default control surface sits off
     the card tokens in dark mode. */
  #dt-filter {
    flex: 1 1 16rem;
    max-width: 24rem;
    min-width: 0;
    padding: 0.5rem 0.75rem;
    font: inherit;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--rule-strong);
    border-radius: 6px;
  }
  #dt-filter:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  #dt-count { color: var(--ink-soft); font-size: 0.85rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
  /* The scope line earns its space only when a filter narrows the view; print
     always shows it so a printed subset never passes for the whole dataset. */
  #dt-filter-context { color: var(--ink-soft); font-size: 0.85rem; margin: 0 0 0.75rem; overflow-wrap: anywhere; }
  #dt-filter-context:not(.filtered) { display: none; }

  /* The table scrolls inside its own box, both ways: sideways for wide rows,
     and vertically under a header that stays put. Without the height cap the
     sticky header has nothing to stick to. */
  .table-wrap {
    overflow: auto;
    max-height: 72vh;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 8px;
  }

  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; font-variant-numeric: tabular-nums; }

  th, td {
    text-align: left;
    padding: 0.55rem 0.9rem;
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
  }

  th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--card);
    border-bottom: 1px solid var(--rule-strong);
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 600;
  }
  th button {
    width: 100%;
    padding: 0;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    text-align: inherit;
    cursor: pointer;
  }
  th button:hover { color: var(--ink); }
  th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  th.sorted { color: var(--accent); }
  th .arrow { opacity: 0; margin-left: 0.3rem; }
  th button:hover .arrow { opacity: 0.5; }
  th.sorted .arrow { opacity: 1; }

  td.num, th.num { text-align: right; }
  td.empty { color: var(--ink-soft); }

  tbody tr:nth-child(even) { background: var(--stripe); }
  tbody tr:hover { background: var(--hover); }
  tbody tr:last-child td { border-bottom: none; }

  .dt-none { padding: 2rem; text-align: center; color: var(--ink-soft); white-space: normal; }

  footer { margin-top: 1rem; color: var(--ink-soft); font-size: 0.82rem; }

  /* Print is always light, whatever the OS scheme or the viewer stamp. */
  @media print {
    :root, :root[data-theme="dark"] {
      color-scheme: light;
      --bg: #fff; --card: #fff; --ink: #000; --ink-soft: #444;
      --rule: #bbb; --rule-strong: #888; --stripe: #fff; --hover: #fff;
      --accent: #000; --accent-soft: transparent;
    }
    .wrap { max-width: none; padding: 0; }
    #dt-filter { display: none; }
    #dt-filter-context:not(.filtered) { display: block; }
    .table-wrap { overflow: visible; max-height: none; border-radius: 0; }
    table { table-layout: fixed; }
    th, td { white-space: normal; overflow-wrap: anywhere; }
    th { position: static; }
    th button:focus-visible { outline: none; }
    tbody tr:hover { background: var(--stripe); }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1><!-- SLOT: TITLE (again, as the visible heading) -->Table title</h1>
    <p class="scope"><!-- SLOT: SCOPE - what this dataset covers and as of when. -->What this covers, and as of when.</p>
  </header>

  <div class="dt-controls">
    <input id="dt-filter" type="search" placeholder="Filter text columns" aria-label="Filter text columns">
    <span id="dt-count" aria-live="polite" aria-atomic="true"></span>
  </div>
  <p id="dt-filter-context">All rows shown. Filter searches text columns only.</p>

  <div class="table-wrap">
    <table id="dt">
      <thead><tr></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <footer><!-- SLOT: FOOTER_NOTE - data source, as-of date, and anything cut
       from the dataset. Omit rather than invent one. -->Source and as-of date.</footer>

</div>

<!-- SLOT: COLUMNS - one entry per column. `type` is "text" or "num"; a "num"
     column right-aligns and sorts numerically. -->
<script type="application/json" id="dt-columns">
[
  { "key": "name",  "label": "Name",  "type": "text" },
  { "key": "value", "label": "Value", "type": "num" }
]
</script>

<!-- SLOT: ROWS - the full dataset, one object per row keyed by the column
     keys above. See the data rules in the skill: numbers unformatted, missing
     values null, dates ISO-8601. -->
<script type="application/json" id="dt-rows">
[
  { "name": "REPLACE ME", "value": 0 }
]
</script>

<script>
/* Sort/filter renderer. Data lives in the two JSON blocks above; this owns
   row emission, so sorting and filtering stay correct. */
(() => {
  'use strict';
  const table = document.getElementById('dt');
  const filter = document.getElementById('dt-filter');
  const count = document.getElementById('dt-count');
  const filterContext = document.getElementById('dt-filter-context');
  if (!table) return;

  const head = table.querySelector('thead tr');
  const body = table.querySelector('tbody');

  const parse = id => {
    const node = document.getElementById(id);
    if (!node) return null;
    try { return JSON.parse(node.textContent); } catch (_) { return null; }
  };

  const columns = parse('dt-columns');
  const rows = parse('dt-rows');
  const object = value => value !== null && typeof value === 'object'
    && !Array.isArray(value);
  // Missing keys such as "constructor" must not read the prototype chain.
  const cell = (row, key) => Object.hasOwn(row, key) ? row[key] : null;
  const validColumns = Array.isArray(columns) && columns.length > 0
    && columns.every(column => object(column)
      && typeof column.key === 'string' && column.key.trim() !== ''
      && (column.label == null
        || ['string', 'number', 'boolean'].includes(typeof column.label))
      && (column.type == null || column.type === 'text' || column.type === 'num'))
    && new Set(columns.map(column => column.key)).size === columns.length;
  const validRows = validColumns && Array.isArray(rows)
    && rows.every(row => object(row) && columns.every(column => {
      const value = cell(row, column.key);
      return value === null || ['string', 'number', 'boolean'].includes(typeof value);
    }));
  if (!validRows) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.className = 'dt-none';
    td.textContent = 'Data failed to load: invalid JSON or malformed columns or rows.';
    tr.append(td);
    body.replaceChildren(tr);
    if (filter) filter.disabled = true;
    if (count) count.textContent = 'Data unavailable';
    if (filterContext) filterContext.textContent = 'The dataset could not be loaded.';
    return;
  }

  let sortKey = null, sortDir = 1;

  const isMissing = v =>
    v == null || (typeof v === 'string' && v.trim() === '');
  const numeric = v => (typeof v === 'number' && Number.isFinite(v)) ? v : null;

  const show = (value, column) => {
    if (isMissing(value)) return '';
    if (column.type === 'num') {
      const n = numeric(value);
      // A non-number in a num column is shown as authored rather than
      // coerced; it skips formatting and sorts after numbers, before missing.
      if (n === null) return String(value);
      return n.toLocaleString(undefined, {maximumFractionDigits: 6});
    }
    return String(value);
  };

  columns.forEach(column => {
    const th = document.createElement('th');
    if (column.type === 'num') th.className = 'num';
    th.scope = 'col';
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = column.label == null ? column.key : String(column.label);
    const arrow = document.createElement('span');
    arrow.className = 'arrow';
    arrow.setAttribute('aria-hidden', 'true');
    arrow.textContent = '↑';
    button.append(arrow);
    button.addEventListener('click', () => {
      sortDir = sortKey === column.key ? -sortDir : 1;
      sortKey = column.key;
      draw();
    });
    th.append(button);
    head.append(th);
  });

  function compare(a, b) {
    const column = columns.find(c => c.key === sortKey);
    const x = cell(a, sortKey), y = cell(b, sortKey);
    // Missing values sort last in both directions: they are absent, not
    // extreme, so flipping the arrow should not parade them to the top.
    const xGone = isMissing(x), yGone = isMissing(y);
    if (xGone && yGone) return 0;
    if (xGone) return 1;
    if (yGone) return -1;
    if (column && column.type === 'num') {
      const nx = numeric(x), ny = numeric(y);
      if (nx === null && ny === null) return 0;
      if (nx === null) return 1;
      if (ny === null) return -1;
      return (nx - ny) * sortDir;
    }
    return String(x).localeCompare(String(y), undefined, {numeric: true})
      * sortDir;
  }

  function matches(row, needle) {
    if (!needle) return true;
    return columns.some(column => {
      if (column.type === 'num') return false;
      const value = cell(row, column.key);
      return !isMissing(value)
        && String(value).toLowerCase().includes(needle);
    });
  }

  function draw() {
    const query = (filter && filter.value || '').trim();
    const needle = query.toLowerCase();
    const visible = rows.filter(row => matches(row, needle));
    if (sortKey) visible.sort(compare);

    body.replaceChildren();
    if (!visible.length) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.className = 'dt-none';
      td.colSpan = columns.length;
      td.textContent = rows.length ? 'No rows match.' : 'No rows.';
      tr.append(td);
      body.append(tr);
    } else {
      const frag = document.createDocumentFragment();
      visible.forEach(row => {
        const tr = document.createElement('tr');
        columns.forEach(column => {
          const td = document.createElement('td');
          const text = show(cell(row, column.key), column);
          if (column.type === 'num') td.className = 'num';
          if (!text) td.className = (td.className + ' empty').trim();
          td.textContent = text;
          tr.append(td);
        });
        frag.append(tr);
      });
      body.append(frag);
    }

    head.querySelectorAll('th').forEach((th, i) => {
      const active = columns[i] && columns[i].key === sortKey;
      th.classList.toggle('sorted', active);
      th.setAttribute('aria-sort', active
        ? (sortDir > 0 ? 'ascending' : 'descending') : 'none');
      const arrow = th.querySelector('.arrow');
      if (arrow) arrow.textContent = sortDir > 0 ? '↑' : '↓';
    });

    if (count) {
      count.textContent = needle
        ? `${visible.length} of ${rows.length} rows`
        : `${rows.length} rows`;
    }
    if (filterContext) {
      filterContext.classList.toggle('filtered', Boolean(query));
      filterContext.textContent = query
        ? `Filtered view: text columns contain "${query}". Only matching rows are shown and printed.`
        : 'All rows shown. Filter searches text columns only.';
    }
  }

  if (filter) filter.addEventListener('input', draw);
  draw();
})();
</script>
</body>
</html>
