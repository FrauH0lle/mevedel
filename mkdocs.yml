site_name: mevedel docs
site_description: Working documentation for mevedel, for humans and agents.
site_url: https://frauh0lle.github.io/mevedel/
repo_url: https://github.com/FrauH0lle/mevedel
edit_uri: edit/master/docs/
docs_dir: docs
theme:
  name: material
  features:
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - search
