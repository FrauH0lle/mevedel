name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # mevedel is Linux-only: portable session storage needs procfs, GNU
        # stat, and bash, and refuses every other host outright.  A macOS or
        # Windows job measures nothing the product claims to support.
        os: [ubuntu-latest]
        emacs-version:
          - 30.2
        experimental: [false]
        # include:
        # - os: ubuntu-latest
        #   emacs-version: snapshot
        #   experimental: true

    steps:
    - uses: actions/checkout@v4

    - uses: jcs090218/setup-emacs@master
      with:
        version: ${{ matrix.emacs-version }}

    - uses: emacs-eask/setup-eask@master
      with:
        version: 'snapshot'

    - name: Install ripgrep (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get -y install ripgrep

    - name: Verify ripgrep
      run: rg --version

    # The Bash analyzer behaves differently once a grammar is present, and the
    # cases covering that path skip without one.  A skip renders as "passed",
    # so without this step a green run is no evidence they ran.  Linux only:
    # the accepted node types do not vary by OS.
    - name: Install Bash tree-sitter grammar (Linux)
      if: runner.os == 'Linux'
      run: |
        emacs -Q --batch --eval "(progn
          (require 'treesit)
          (setq treesit-language-source-alist
                '((bash \"https://github.com/tree-sitter/tree-sitter-bash\" \"v0.6.0\")))
          (treesit-install-language-grammar 'bash \"$HOME/ts-grammars\"))"
        echo "LD_LIBRARY_PATH=$HOME/ts-grammars" >> "$GITHUB_ENV"

    - name: Clean Eask state
      run: eask clean all

    # HACK: Work around package.el skipping bundled package upgrades during
    # dependency installation; gptel needs a newer transient than Emacs 30.2
    # ships.
    - name: Install transient
      run: eask install transient --force

    - name: Install dependencies
      run: eask install-deps --dev

    - name: Run tests
      run: eask test ert test/test-*.el

    - name: Compile
      run: eask compile

    - name: Build package
      run: eask package

    - name: Install package
      run: eask install

  remote-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - uses: jcs090218/setup-emacs@master
      with:
        version: 30.2

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get -y install podman ripgrep

    # Ubuntu 24.04 confines unprivileged user namespaces through AppArmor, and
    # the restriction reaches into the containers, so the sandbox the
    # acceptance run exercises cannot start.
    - name: Permit unprivileged user namespaces
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

    - name: Install transient
      run: npx @emacs-eask/cli install transient --force

    - name: Install dependencies
      run: npx @emacs-eask/cli install-deps --dev

    - name: Run real transport acceptance
      run: test/run-remote-acceptance.sh
