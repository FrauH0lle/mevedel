name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        emacs-version:
          - 30.2
        experimental: [false]
        # include:
        # - os: ubuntu-latest
        #   emacs-version: snapshot
        #   experimental: true
        # - os: macos-latest
        #   emacs-version: snapshot
        #   experimental: true
        # - os: windows-latest
        #   emacs-version: snapshot
        #   experimental: true

    steps:
    - uses: actions/checkout@v4

    - uses: jcs090218/setup-emacs@master
      with:
        version: ${{ matrix.emacs-version }}

    - uses: emacs-eask/setup-eask@master
      with:
        version: 'snapshot'

    - name: Install ripgrep (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get -y install ripgrep

    - name: Install ripgrep (macOS)
      if: runner.os == 'macOS'
      run: brew install ripgrep

    - name: Install ripgrep (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $version = '15.2.0'
        $archive = Join-Path $env:RUNNER_TEMP 'ripgrep.zip'
        $destination = Join-Path $env:RUNNER_TEMP 'ripgrep'
        Invoke-WebRequest `
          "https://github.com/BurntSushi/ripgrep/releases/download/$version/ripgrep-$version-x86_64-pc-windows-msvc.zip" `
          -OutFile $archive
        $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
        if ($hash -ne '71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5') {
          throw 'ripgrep checksum mismatch'
        }
        Expand-Archive $archive -DestinationPath $destination
        Join-Path $destination "ripgrep-$version-x86_64-pc-windows-msvc" |
          Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Verify ripgrep
      run: rg --version

    - name: Clean Eask state
      run: eask clean all

    # HACK: Work around package.el skipping bundled package upgrades during
    # dependency installation; gptel needs a newer transient than Emacs 30.2
    # ships.
    - name: Install transient
      run: eask install transient --force

    - name: Install dependencies
      run: eask install-deps --dev

    - name: Run tests
      run: eask test ert test/test-*.el

    - name: Compile
      run: eask compile

    - name: Build package
      run: eask package

    - name: Install package
      run: eask install

  remote-transport:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: jcs090218/setup-emacs@master
      with:
        version: 30.2

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get -y install podman ripgrep

    - name: Install transient
      run: npx @emacs-eask/cli install transient --force

    - name: Install dependencies
      run: npx @emacs-eask/cli install-deps --dev

    - name: Run real transport acceptance
      run: test/run-remote-acceptance.sh
