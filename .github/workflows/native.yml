name: Native module

# Build the native animation module for users without a C compiler or the
# GTK 3/Wayland development files.  Each source revision gets a release
# `native-HASH` (HASH: first 16 hex digits of the C source's SHA-256) and its
# module checksums are pinned in native/prebuilt.eld, which
# `mevedel-view-native-install' verifies before loading a download.

on:
  push:
    branches: [master]
    paths:
      - native/mevedel-view-native.c
      - native/build-prebuilt.sh
      - .github/workflows/native.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-module
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc libc6-dev pkg-config libgtk-3-dev libwayland-dev emacs-nox binutils
      - name: Build
        run: native/build-prebuilt.sh "${{ matrix.arch }}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.arch }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Publish release and pin checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          hash=$(sha256sum native/mevedel-view-native.c | cut -c1-16)
          tag="native-$hash"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists; its pinned modules stand."
            exit 0
          fi
          gh release create "$tag" --title "Native animation module $hash" \
            --notes "Prebuilt native animation modules for source $hash." \
            dist/mevedel-view-native-*.so
          entry="(\"$hash\""
          for file in dist/mevedel-view-native-*.so.sha256; do
            arch=$(basename "$file" .so.sha256 | sed 's/^mevedel-view-native-//')
            entry="$entry (\"$arch\" . \"$(cut -c1-64 "$file")\")"
          done
          entry="$entry)"
          python3 - "$entry" <<'PY'
          import pathlib, sys
          path = pathlib.Path("native/prebuilt.eld")
          lines = path.read_text().splitlines()
          head = [line for line in lines if line.startswith(";;")]
          body = "\n".join(line for line in lines if not line.startswith(";;")).strip()
          # Only the current source's entry is kept: older revisions of
          # mevedel ship their own pins.
          path.write_text("\n".join(head) + "\n(" + sys.argv[1] + ")\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/prebuilt.eld
          git commit -m "chore(native): Pin prebuilt module checksums for $hash"
          git push
