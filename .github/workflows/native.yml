name: Native module

# Build the native module for users without a C compiler or the GTK
# 3/Wayland development files.  Each source revision gets a release
# `native-HASH` (HASH: first 16 hex digits of the SHA-256 of native/*.c,
# concatenated in byte order) and its module checksums are pinned in
# native/prebuilt.eld, which `mevedel-native-install' verifies before loading
# a download.

on:
  push:
    branches: [master]
    paths:
      - native/*.c
      - native/build-prebuilt.sh
      - .github/workflows/native.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-module
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc libc6-dev pkg-config libgtk-3-dev libwayland-dev emacs-nox binutils
      - name: Build
        run: native/build-prebuilt.sh "${{ matrix.arch }}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.arch }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    # Only this job publishes; the builds run third-party code.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release and pin checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/master ]; then
            echo "Pins are published from master only."
            exit 0
          fi
          source_hash() { LC_ALL=C ls native/*.c | LC_ALL=C sort | xargs cat | sha256sum | cut -c1-16; }
          hash=$(source_hash)
          tag="native-$hash"
          # Pin onto the current master; newer sources are a later run's.
          git pull --rebase origin master
          if [ "$(source_hash)" != "$hash" ]; then
            echo "Sources changed since $hash; a later run pins them."
            exit 0
          fi
          if grep -q "\"$hash\"" native/prebuilt.eld; then
            echo "Source $hash is pinned."
            exit 0
          fi
          for arch in x86_64 aarch64; do
            test -f "dist/mevedel-native-$arch.so" || { echo "No $arch module built" >&2; exit 1; }
          done
          # An unpinned release was never installable, so an earlier run's
          # assets, complete or not, are replaced by this build's.
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "Native module $hash" \
                 --notes "Prebuilt native modules for source $hash."
          gh release upload "$tag" dist/mevedel-native-*.so --clobber
          entry="(\"$hash\""
          for file in dist/mevedel-native-*.so.sha256; do
            arch=$(basename "$file" .so.sha256 | sed 's/^mevedel-native-//')
            entry="$entry (\"$arch\" . \"$(cut -c1-64 "$file")\")"
          done
          entry="$entry)"
          python3 - "$entry" <<'PY'
          import pathlib, sys
          path = pathlib.Path("native/prebuilt.eld")
          lines = path.read_text().splitlines()
          head = [line for line in lines if line.startswith(";;")]
          # Only the current source's entry is kept: older revisions of
          # mevedel ship their own pins.
          path.write_text("\n".join(head) + "\n(" + sys.argv[1] + ")\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/prebuilt.eld
          git commit -m "chore(native): Pin prebuilt module checksums for $hash"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin master
            if [ "$(source_hash)" != "$hash" ]; then
              echo "Sources changed since $hash; a later run pins them."
              exit 0
            fi
          done
          exit 1
